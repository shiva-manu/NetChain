services:
  netchain:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "30333:30333" # P2P
      - "8545:8545" # HTTP gateway: /rpc, /api/v1, /health, /metrics, /validators, /genesis, /ws
    environment:
      PORT: 8545
      NETCHAIN_LOG_LEVEL: info
      # To join an existing network instead of starting a private dev chain:
      # NETCHAIN_GENESIS_URL: https://<existing-node>/genesis
      # NETCHAIN_BOOTNODES: /dns4/<bootnode-host>/tcp/<port>
    volumes:
      - ./data:/data
    restart: unless-stopped

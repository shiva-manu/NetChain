version: "3.9"

services:
  netchain:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "30333:30333"
      - "8545:8545"
      - "9090:9090"
    environment:
      NETCHAIN_CONFIG: /app/config/default.toml
      NETCHAIN_RPC_BIND_ADDR: 0.0.0.0
      NETCHAIN_MONITORING_BIND_ADDR: 0.0.0.0
      NETCHAIN_LOG_LEVEL: info
      DATA_DIR: /app/data
      PORT: 30333
      RPC_PORT: 8545
      NETCHAIN_MONITORING_PORT: 9090
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped

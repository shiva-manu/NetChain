[package]
name = "netchain"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "netchain"
path = "src/main.rs"

[[bin]]
name = "netchain-wallet"
path = "src/bin/wallet.rs"

[dependencies]
# Error handling
anyhow = "1.0"

# Config
toml = "0.8"

# Async runtime
tokio = { version = "1.36", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
argon2 = "0.5"
aes-gcm = "0.10"

# Encoding
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
bincode = { version = "2.0", features = ["serde"] }
zeroize = "1.8"

# Random
rand = "0.8"

# CLI
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"
libc = "0.2"

# HTTP server/client
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }

# WebSocket
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Persistent storage
sled = "0.34"

# WASM smart contract VM
wasmi = "0.40"

# libp2p (FULL REQUIRED FEATURE SET)
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "dns",
    "mdns",
    "noise",
    "yamux",
    "gossipsub",
    "kad",
    "macros"
] }

[dev-dependencies]
tempfile = "3.10"
wat = "1.0"

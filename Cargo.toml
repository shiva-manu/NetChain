[package]
name = "netchain"
version = "0.1.0"
edition = "2021"

[dependencies]
# Error handling
anyhow = "1.0"

# Async runtime
tokio = { version = "1.36", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography
sha2 = "0.10"

# libp2p (FULL REQUIRED FEATURE SET)
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "dns",
    "mdns",
    "noise",
    "yamux",
    "gossipsub",
    "macros"
] }

rand = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }

bincode = { version = "2.0", features = ["serde"] }

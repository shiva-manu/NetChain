# NetChain node configuration. Every value can be overridden by environment variables
# (see README / RAILWAY.md).

[node]
data_dir = "./data"
p2p_port = 30333
log_level = "info"
# Network to join. Leave all three unset to start a private single-validator dev chain
# (written to <data_dir>/genesis.json).
# genesis_file = "config/genesis.json"
# genesis_json = '{"chain_id": "...", ...}'
# genesis_url = "https://<existing-node>/genesis"
# Peers to connect to, e.g. ["/ip4/203.0.113.7/tcp/30333", "/dns4/node.example.com/tcp/30333"].
bootnodes = []
# Public addresses of this node advertised to peers (Railway's TCP proxy is added automatically).
external_addrs = []
# Discover peers on the local network.
enable_mdns = true

# One port serves /rpc, /api/v1/*, /health, /metrics, /validators, /genesis and /ws.
[http]
bind_addr = "127.0.0.1"
port = 8545

# Chain parameters used only when this node creates a development genesis.
# On a shared network these come from the genesis file.
[producer]
max_txs_per_block = 100
block_interval_secs = 15
block_reward = 50
stake_weight = 0.3
mempool_ttl_secs = 900

[faucet]
enabled = true
# Hex key file holding the faucet funds; defaults to this node's key.
# key_file = "./data/faucet_key"
amount = 200
fee = 1
cooldown_secs = 3600
max_per_minute = 30

[poi]
# How often a validator probes its validator peers and records attestations on-chain.
attest_interval_secs = 120
probe_bytes = 1000000
attestation_fee = 1
